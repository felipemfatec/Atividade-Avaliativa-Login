<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <h1>Cadastrar</h1>
    <form id="cadastroForm">
      <input type="text" id="novoNome" placeholder="Nome Completo" required>
      <input type="email" id="novoEmail" placeholder="E-mail" required>
      <input type="text" id="novoUsuario" placeholder="Escolha um Usuário" required>
      <input type="password" id="novaSenha" placeholder="Crie uma Senha" required>
      <button type="submit" style="margin-top: 10px;">Finalizar Cadastro</button>
    </form>
    <div style="margin-top: 15px; text-align: center;">
      <a href="index.html" style="color: #03dac6; text-decoration: none; font-size: 0.9rem;">Já tem uma conta? Voltar ao Login</a>
    </div>
  </div>
</body>
</html>
